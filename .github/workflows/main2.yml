name: Scrape Upcoming Events

on:
  schedule:
    # Har 6 ghante baad auto-run hoga (UTC)
    - cron: '0 */6 * * *'
  # GitHub Actions tab se manually run karne ke liye
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          playwright install chromium --with-deps

      - name: Run Scraper Script
        run: |
          python main2.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add fancode_matches.json
          
          # Sirf tab commit karega jab data mein koi changes honge
          if git diff --staged --quiet; then
            echo "No changes found. Skipping commit."
          else
            git commit -m "chore: auto-update fancode matches [skip ci]"
            git push
          fi
          
